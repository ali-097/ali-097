name: refresh profile cards

on:
  schedule:
    # Daily at 03:17 UTC. Off the hour so it isn't queued behind the crowd
    # of jobs everyone else schedules at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/fonts/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh-cards
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Render SVGs
        env:
          # PROFILE_TOKEN is optional: a classic PAT with read:user returns
          # richer contribution data than the default GITHUB_TOKEN. The script
          # falls back cleanly if it is absent or the query fails.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/render.mjs

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          if git diff --staged --quiet; then
            echo "cards unchanged"
          else
            git commit -m "chore(cards): refresh generated SVGs"
            git push
          fi
